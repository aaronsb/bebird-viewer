# Builds in the same container as `make android-test android-apk` does locally.
name: Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "docker/android.Dockerfile"
      - ".dockerignore"
      - "Makefile"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "docker/android.Dockerfile"
      - ".dockerignore"
      - "Makefile"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: make android-image
      - name: Unit tests
        run: make android-test
      - name: Debug APK
        run: make android-apk
      - uses: actions/upload-artifact@v4
        with:
          name: bebird-viewer-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
