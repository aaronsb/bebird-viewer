# SPDX-License-Identifier: GPL-3.0-or-later
# Builds the signed release APK in the same container as `make android-release` does locally and
# publishes it as a GitHub Release. The tag need not be GPG-signed (CI has no public key to check
# it); GPG is local only: `make release-sign` adds the checksum's signature after publishing. Pushing a tag vX.Y.Z publishes; running it by hand
# (workflow_dispatch) is a dry run that only uploads the APK as a workflow artifact.
# Secrets and how to cut a release: docs/building.md#release-builds.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # A tag push publishes, so it must be signed; a dry run without the secrets builds unsigned.
  PUBLISH: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      cert: ${{ steps.verify.outputs.cert }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@v4

      - name: Version matches the tag
        id: version
        run: |
          version=$(sed -nE 's/^ *versionName = "([^"]+)".*/\1/p' android/app/build.gradle.kts)
          test -n "$version" || { echo "::error::no versionName in android/app/build.gradle.kts"; exit 1; }
          if [ "$PUBLISH" = true ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match versionName $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.BEBIRD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$PUBLISH" = true ]; then echo "::error::secret BEBIRD_KEYSTORE_BASE64 is not set"; exit 1; fi
            echo "::warning::BEBIRD_KEYSTORE_BASE64 is not set: building an unsigned APK"
            exit 0
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "BEBIRD_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: make android-image
      - name: Unit tests
        run: make android-test
      - name: Release APK
        env:
          BEBIRD_KEYSTORE_PASSWORD: ${{ secrets.BEBIRD_KEYSTORE_PASSWORD }}
          BEBIRD_KEY_ALIAS: ${{ secrets.BEBIRD_KEY_ALIAS }}
          BEBIRD_KEY_PASSWORD: ${{ secrets.BEBIRD_KEY_PASSWORD }}
        run: make android-release
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Verify signature and certificate
        id: verify
        if: steps.keystore.outputs.signed == 'true'
        env:
          EXPECTED_CERT: ${{ vars.BEBIRD_CERT_SHA256 || secrets.BEBIRD_CERT_SHA256 }}
        run: |
          make android-release-verify APK=android/app/build/outputs/apk/release/app-release.apk | tee "$RUNNER_TEMP/verify.txt"
          for want in "Number of signers: 1" \
                      "Verified using v2 scheme (APK Signature Scheme v2): true" \
                      "Verified using v3 scheme (APK Signature Scheme v3): true"; do
            grep -qxF "$want" "$RUNNER_TEMP/verify.txt" || { echo "::error::apksigner did not report: $want"; exit 1; }
          done
          actual=$(sed -nE 's/^Signer #1 certificate SHA-256 digest: ([0-9a-f]+)$/\1/p' "$RUNNER_TEMP/verify.txt")
          if [ -n "$EXPECTED_CERT" ]; then
            expected=$(printf '%s' "$EXPECTED_CERT" | tr -d ':[:space:]' | tr 'A-F' 'a-f')
            [ "$actual" = "$expected" ] || { echo "::error::signed with certificate $actual, expected $expected"; exit 1; }
          else
            echo "::warning::BEBIRD_CERT_SHA256 is not set: the signing certificate ($actual) was not checked"
          fi
          echo "cert=$actual" >> "$GITHUB_OUTPUT"

      - name: Name and checksum
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGNED: ${{ steps.keystore.outputs.signed }}
        run: |
          mkdir -p out
          if [ "$SIGNED" = true ]; then name=bebird-$VERSION.apk; src=app-release.apk
          else name=bebird-$VERSION-unsigned.apk; src=app-release-unsigned.apk; fi
          cp "android/app/build/outputs/apk/release/$src" "out/$name"
          (cd out && sha256sum "$name" > "$name.sha256" && cat "$name.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: bebird-release-apk
          path: out/
          if-no-files-found: error
      # R8's mapping turns obfuscated stack traces from this build back into source names.
      - uses: actions/upload-artifact@v4
        with:
          name: bebird-release-mapping
          path: android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: bebird-release-apk
          path: out
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          CERT: ${{ needs.build.outputs.cert }}
        run: |
          # Notes: the CHANGELOG.md section for this version (else GitHub's generated notes), then
          # how to verify the download.
          notes="$RUNNER_TEMP/notes.md"
          awk -v head="## [$VERSION]" 'index($0, head) == 1 {on = 1; next} on && /^## \[/ {exit} on' \
            CHANGELOG.md > "$notes" 2>/dev/null || true
          if grep -q '[^[:space:]]' "$notes"; then generate=(); else generate=(--generate-notes); fi
          apk=bebird-$VERSION.apk
          cat >> "$notes" <<EOF

          ## Verifying the download

          With the files in one directory:

          \`\`\`sh
          sha256sum -c $apk.sha256
          gpg --verify $apk.sha256.asc $apk.sha256
          apksigner verify --print-certs $apk
          \`\`\`

          \`$apk.sha256.asc\`, the maintainer's GPG signature of the checksum, is added shortly after the release is published. apksigner must report this signing certificate SHA-256 digest, the same for every release:

          \`$CERT\`
          EOF
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "bebird-viewer $VERSION" \
            --notes-file "$notes" "${generate[@]}" \
            "out/$apk" "out/$apk.sha256" LICENSE LICENSES/Apache-2.0.txt
